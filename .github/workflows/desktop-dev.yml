name: Desktop dev prerelease

on:
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: desktop-dev-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: 0.1.0-dev.${{ github.run_number }}.${{ github.run_attempt }}
      release_tag: dev-${{ github.run_number }}-${{ github.run_attempt }}
      prerelease: true
      make_latest: false
