[package]
name = "oas-desktop"
version = "0.1.0"
description = "Tauri desktop shell for OnmyojiAutoScript"
authors = ["OnmyojiAutoScript contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "oas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
tauri = { version = "2.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
