[project]
name = "onmyoji-auto-script"
version = "0.1.0"
description = "Onmyoji automation service and desktop application"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
    "numpy==1.24.3",
    "opencv-python==4.7.0.72",
    "adbutils==0.11.0",
    "uiautomator2==2.16.17",
    "uiautomator2cache==0.3.0.1",
    "wrapt==1.15.0",
    "psutil==6.1.1",
    "pywin32==306; sys_platform == 'win32'",
    "ppocr-onnx==0.0.3.9",
    "cn2an==0.5.23",
    "paho-mqtt==1.6.1",
    "fastapi==0.104.1",
    "uvicorn==0.38.0",
    "websockets==13.1",
    "zerorpc==0.6.3",
    "pydantic==2.10.0",
    "rich==13.3.5",
    "pyyaml==6.0",
    "tqdm==4.65.0",
    "anytree==2.8.0",
    "cryptography==42.0.8",
    "onepush==1.3.0",
    "inflection==0.5.1",
    "frida==17.6.2",
    "frida-tools==14.5.2",
    "oashya==0.0.7",
    "oas-checkin-biggod==0.0.1",
    "cached-property==1.5.2",
    "filelock==3.13.1",
    "msgpack==1.0.7",
    "pillow==10.2.0",
    "requests==2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
]

[tool.uv]
# The backend is run from source. The desktop artifact bundles the source and a
# python-build-standalone runtime rather than building a Python wheel.
package = false
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
